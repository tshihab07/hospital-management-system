{% load static i18n %}<!doctype html>
<html lang="{{ current_language|default:'en' }}" data-theme="light" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#4F46E5">
  <title>{% block title %}{% trans "Dashboard" %}{% endblock %} · {{ HOSPITAL_NAME }}</title>

  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind.config.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/ihms.css' %}">

  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-page font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  {% include "components/messages.html" %}

  {% block body %}{% endblock %}

  {% include "components/toast.html" %}

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.lucide) { window.lucide.createIcons(); }
    });
    document.body.addEventListener("htmx:afterSwap", function () {
      if (window.lucide) { window.lucide.createIcons(); }
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
