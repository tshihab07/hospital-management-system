{% load i18n %}
<header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-surface/80 px-4 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80 sm:px-6">
  <button type="button" class="grid h-10 w-10 place-items-center rounded-lg text-slate-500 hover:bg-muted lg:hidden"
          @click="sidebarOpen = true" aria-label="{% trans 'Open menu' %}">
    <i data-lucide="menu" class="h-5 w-5"></i>
  </button>

  <div class="relative hidden max-w-md flex-1 md:block">
    <label for="global-search" class="sr-only">{% trans "Search patients, UHID, IP number" %}</label>
    <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
    <input id="global-search" type="search" name="q" autocomplete="off"
           placeholder="{% trans 'Search patient, UHID, phone…' %}"
           class="h-10 w-full rounded-[10px] border border-slate-200 bg-page pl-9 pr-16 text-sm text-slate-700 placeholder:text-slate-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
    <kbd class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded border border-slate-200 px-1.5 py-0.5 text-[10px] text-slate-400 dark:border-slate-600">⌘K</kbd>
  </div>

  <div class="ml-auto flex items-center gap-1.5">
    <button type="button" class="grid h-10 w-10 place-items-center rounded-lg text-slate-500 hover:bg-muted dark:hover:bg-slate-800" aria-label="{% trans 'Notifications' %}">
      <i data-lucide="bell" class="h-5 w-5"></i>
    </button>

    <button type="button" @click="$store.theme.toggle()"
            class="grid h-10 w-10 place-items-center rounded-lg text-slate-500 hover:bg-muted dark:hover:bg-slate-800"
            aria-label="{% trans 'Toggle dark mode' %}">
      <i data-lucide="moon" class="h-5 w-5 dark:hidden"></i>
      <i data-lucide="sun" class="hidden h-5 w-5 dark:block"></i>
    </button>

    <div class="relative" x-data="{ open: false }">
      <button type="button" @click="open = !open" @click.outside="open = false"
              class="flex items-center gap-2 rounded-lg py-1 pl-1 pr-2 hover:bg-muted dark:hover:bg-slate-800">
        <span class="grid h-8 w-8 place-items-center rounded-full bg-primary-500 text-xs font-semibold text-white">
          {{ request.user.initials }}
        </span>
        <span class="hidden text-left sm:block">
          <span class="block text-sm font-medium leading-tight text-slate-700 dark:text-slate-200">{{ request.user.display_name }}</span>
          <span class="block text-[11px] leading-tight text-slate-400">{{ request.user.designation|default:_("Staff") }}</span>
        </span>
        <i data-lucide="chevron-down" class="hidden h-4 w-4 text-slate-400 sm:block"></i>
      </button>

      <div x-show="open" x-transition.origin.top.right
           class="absolute right-0 mt-2 w-56 overflow-hidden rounded-2xl border border-slate-200 bg-surface shadow-lg dark:border-slate-700 dark:bg-slate-900"
           style="display:none">
        <div class="border-b border-slate-100 px-4 py-3 dark:border-slate-800">
          <p class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ request.user.get_full_name }}</p>
          <p class="truncate text-xs text-slate-400">{{ request.user.email }}</p>
        </div>
        <a href="{% url 'accounts:profile' %}" class="flex items-center gap-2 px-4 py-2.5 text-sm text-slate-600 hover:bg-muted dark:text-slate-300 dark:hover:bg-slate-800">
          <i data-lucide="user" class="h-4 w-4"></i> {% trans "My profile" %}
        </a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="flex w-full items-center gap-2 px-4 py-2.5 text-left text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10">
            <i data-lucide="log-out" class="h-4 w-4"></i> {% trans "Sign out" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</header>
