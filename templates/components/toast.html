{% load i18n %}
<div x-data="toasts" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[22rem] max-w-[calc(100vw-2rem)] flex-col gap-2">
  <template x-for="toast in items" :key="toast.id">
    <div class="pointer-events-auto flex items-start gap-3 rounded-2xl border p-4 shadow-lg"
         :class="{
           'border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-200': toast.variant === 'success',
           'border-red-200 bg-red-50 text-red-800 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200': toast.variant === 'danger',
           'border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-200': toast.variant === 'warning',
           'border-blue-200 bg-blue-50 text-blue-800 dark:border-blue-500/30 dark:bg-blue-500/10 dark:text-blue-200': !['success','danger','warning'].includes(toast.variant)
         }"
         x-transition:enter="animate-fade-up">
      <p class="flex-1 text-sm" x-text="toast.message"></p>
      <button type="button" @click="remove(toast.id)" class="text-current/60 hover:text-current" aria-label="{% trans 'Dismiss' %}">
        <i data-lucide="x" class="h-4 w-4"></i>
      </button>
    </div>
  </template>
</div>
